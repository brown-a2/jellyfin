apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      {{- if .Values.plugins.openSubtitles.enabled }}
      initContainers:
        - name: install-opensubtitles
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              # Never fail the pod: a missing plugin must not stop Jellyfin from starting.
              VER={{ .Values.plugins.openSubtitles.version }}
              DEST="{{ .Values.persistence.config.mountPath }}/plugins/Open Subtitles_${VER}"
              URL="https://repo.jellyfin.org/files/plugin/open-subtitles/open-subtitles_${VER}.zip"
              fail() {
                echo "WARNING: Open Subtitles $VER not installed ($1); starting Jellyfin without it"
                rm -rf "$DEST"
                exit 0
              }
              if [ -f "$DEST/Jellyfin.Plugin.OpenSubtitles.dll" ]; then
                echo "Open Subtitles $VER already installed"
                exit 0
              fi
              wget -O /tmp/os.zip "$URL" || fail "download failed: $URL"
              echo "{{ .Values.plugins.openSubtitles.checksum }}  /tmp/os.zip" | md5sum -c - || fail "checksum mismatch"
              mkdir -p "$DEST" || fail "cannot create $DEST"
              unzip -o /tmp/os.zip -d "$DEST" || fail "unzip failed"
              echo "Installed Open Subtitles $VER"
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.persistence.config.mountPath }}
      {{- end }}
      containers:
        - name: jellyfin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8096
          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.persistence.config.mountPath }}
            - name: media-volume
              mountPath: {{ .Values.persistence.media.mountPath }}
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: jellyfin-media-pvc
