namespace: jellyfin

persistence:
  config:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: local-storage
    existingClaim: ""
    mountPath: /config

  media:
    enabled: true
    accessMode: ReadWriteMany
    size: 4Ti
    storageClass: manual
    existingClaim: ""
    mountPath: /media

replicaCount: 1

image:
  repository: jellyfin/jellyfin
  # Pinned so plugin versions below stay ABI-compatible with the server.
  # Bump together with plugins.*.version/checksum when upgrading.
  tag: "12.2"
  pullPolicy: IfNotPresent

# Plugins installed into /config/plugins by an init container before Jellyfin starts.
# Versions and md5 checksums come from https://repo.jellyfin.org/files/plugin/manifest.json
plugins:
  openSubtitles:
    enabled: true
    version: "25.0.0.0"   # targetAbi 12.0.0.0
    checksum: "4fe7744c4e24f22fcb395c90d66fbfb6"

service:
  type: ClusterIP
  port: 8096
# ndots:1 makes external names (repo.jellyfin.org) resolve as-is instead of first
# walking the node's search domains (totoro-pi.ddns.net, lan). One of those returns
# SERVFAIL, which Alpine/musl treats as fatal ("bad address").
dnsConfig:
  options:
    - name: ndots
      value: "1"
